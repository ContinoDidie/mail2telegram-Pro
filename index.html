<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail2Telegram Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .alias-box {
      background: #0f172a;
      border: 1px dashed var(--accent);
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      font-family: monospace;
      color: var(--accent);
      text-align: center;
      margin-top: 8px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      float: right;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Plan Activo</span>
    <h2>📩 Mi Email Alias</h2>
    <p style="color: var(--text-dim); font-size: 0.9rem;">
      Reenvía tus correos importantes o configúralo en tus servicios a esta dirección:
    </p>
    <div class="alias-box" id="userAlias">cargando_alias...@mail2telegram.pro</div>
    <button class="btn" onclick="copyAlias()">📋 Copiar Dirección</button>
  </div>

  <div class="card">
    <h3>⚙️ Filtros Inteligentes (Gemini AI)</h3>
    <p style="color: var(--text-dim); font-size: 0.85rem;">
      Gemini resumirá los correos y solo te notificará según tus reglas.
    </p>
    <label><input type="checkbox" checked> Resumen ejecutivo automático</label><br><br>
    <label><input type="checkbox" checked> Alertar solo si contiene compras / facturas</label>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Generar o mostrar alias basado en el ID de usuario
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const userId = tg.initDataUnsafe.user.id;
      document.getElementById('userAlias').innerText = `user_${userId}@mail2telegram.pro`;
    }

    function copyAlias() {
      const aliasText = document.getElementById('userAlias').innerText;
      navigator.clipboard.writeText(aliasText);
      tg.showAlert("¡Dirección copiada al portapapeles!");
    }
  </script>
</body>
</html>
